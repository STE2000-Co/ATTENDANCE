<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Time System</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="card.css">
</head>
<body>

<div class="app-wrapper">

  <!-- LOGIN -->
  <div id="loginSection" class="login-container">
    <div class="login-card">
      <div class="logo-text">EMPLOYEE SYSTEM</div>

      <div class="input-group">
        <input type="email" id="email" required>
        <label>Email</label>
      </div>

      <div class="input-group">
        <input type="password" id="password" required>
        <label>Password</label>
      </div>

      <button class="primary-btn" onclick="login()">Login</button>
    </div>
  </div>

  <!-- APP -->
  <div id="appSection" style="display:none;">

    <!-- FRONT CARD -->
<div class="employee-card front-card">

  <div class="card-bg"></div>

  <div class="card-content">

    <div class="photo-box">
      <div class="avatar"></div>
    </div>

    <div class="field name" id="empName">-</div>
    <div class="field empid">
      ID : <span id="empId">-</span>
    </div>

    <div class="field position" id="empPosition">-</div>
    <div class="field department" id="empDepartment">-</div>
    <div class="field issue-date" id="empIssueDate">-</div>

  </div>

</div>

<!-- BACK CARD -->
<div class="employee-card back-card">

  <div class="card-bg"></div>

  <div class="card-content">

    <div class="barcode-wrapper">
      <svg id="barcode"></svg>
    </div>

  </div>

</div>

    <div class="datetime">
      <div id="liveDate" class="date-text"></div>
      <div id="liveTime" class="time-text"></div>
    </div>

    <button id="actionBtn"
            class="primary-btn action-btn"
            onclick="actionHandler()">
      เข้างาน
    </button>

    <!-- ✅ เพิ่มตรงนี้ -->
    <div id="todayInfo"
         style="margin-top:16px;font-size:14px;opacity:.85;text-align:center;">
    </div>

  </div>

</div>

<!-- CUSTOM POPUP -->
<div id="customPopup" class="popup-overlay">
  <div class="popup-box">
    <div id="popupMessage" class="popup-message"></div>
    <button class="popup-btn" onclick="closePopup()">ตกลง</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
