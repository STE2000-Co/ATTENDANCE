<!DOCTYPE html>
<html lang="th">
<head>
  <script>
  if (sessionStorage.getItem("appLoaded")) {
    document.documentElement.classList.add("no-splash");
  }
</script>
  <meta charset="UTF-8">
 <meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Employee Time System</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="card.css">
</head>
<body>

 <!-- SPLASH SCREEN -->
<div id="splashScreen" class="splash">
  <img src="STElogo.png" class="splash-logo" />
</div>
  
<div class="app-wrapper">

  <!-- LOGIN -->
  <div id="loginSection" class="login-container auth-screen">
    <div class="login-card">
      <div class="logo-text">EMPLOYEE SYSTEM</div>
      

      <div class="input-group">
        <input type="email" id="email" required>
        <label>Email</label>
      </div>

      <div class="input-group">
        <input type="password" id="password" required>
        <label>Password</label>
      </div>

      <button class="primary-btn" onclick="login()">Login</button>
      <div class="sub-header">by STE2000</div>
    </div>
  </div>

  <!-- APP -->
 <div id="appSection" class="auth-screen">
   
    <!-- ✅ เพิ่ม container สำหรับ layout มือถือ -->
    <div class="app-container">

      <div class="employee-card vertical">

        <div class="card-top">
          <div class="company-title">
            EMPOLYEE ID CARD
            <div class="company-name">S.TUNTIVIVAT ENGINEERING 2000 CO.,LTD.</div>
            
          </div>
        </div>

        <div class="photo-wrapper">
          <div class="avatar large">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
            </svg>
          </div>
        </div>

        <div class="card-info">
          <div class="emp-name" id="empName">-</div>
          <div class="emp-position" id="empPosition">-</div>
          <div class="emp-dept" id="empDept">-</div>
        </div>

        <div class="card-issued">
          ID: <span id="empId">-</span>
         &nbsp; | &nbsp;
         ISSUED: <span id="empIssued">-</span>
        </div>

        <svg id="barcode" class="barcode"></svg>

      </div>

      <div class="datetime">
        <div id="liveDate" class="date-text"></div>
      </div>

      <button id="actionBtn"
              class="primary-btn action-btn"
              onclick="actionHandler()">
   เข้างาน
</button>
        <button id="leaveBtn"
        <button class="secondary-btn"
        onclick="goLeave()">
  ลางาน
</button>

      <div id="todayInfo"
           style="margin-top:16px;font-size:14px;opacity:.85;text-align:center;">
      </div>

    </div>
    <!-- ✅ จบ app-container -->

  </div>

</div>

<!-- CUSTOM POPUP -->
<div id="customPopup" class="popup-overlay">
  <div class="popup-box">
    <div id="popupMessage" class="popup-message"></div>
    <button class="popup-btn" onclick="closePopup()">ตกลง</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
