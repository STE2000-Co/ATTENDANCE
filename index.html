<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Time System</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="card.css">
</head>
<body>

<div class="app-wrapper">

  <!-- LOGIN -->
  <div id="loginSection" class="login-container">
    <div class="login-card">
      <div class="logo-text">EMPLOYEE SYSTEM</div>

      <div class="input-group">
        <input type="email" id="email" required>
        <label>Email</label>
      </div>

      <div class="input-group">
        <input type="password" id="password" required>
        <label>Password</label>
      </div>

      <button class="primary-btn" onclick="login()">Login</button>
    </div>
  </div>

  <!-- APP -->
  <div id="appSection" style="display:none;">

    <div class="employee-card">

      <div class="card-top">
        <div class="company-name">
          S.TUNTIVIVAT ENGINEERING 2000 CO.,LTD.
        </div>

        <!-- ✅ เพิ่ม id ตรงนี้ -->
        <div id="employeeName" class="employeeName">NAME</div>
        <div id="employeePosition" class="employeePosition">TITLE</div>
        <div id="employeeDepartment" class="employeeDepartment">DEPARTMENT</div>
      </div>

      <div class="card-divider"></div>

      <div class="card-bottom">
        <div class="profile-section">
          <div class="profile-img">
            <!-- SVG USER ICON -->
          </div>

          <!-- ✅ เพิ่ม id -->
          <div id="employeeId" class="employeeId">ID: 12345</div>
        </div>

        <!-- ✅ เพิ่ม id -->
        <div id="employeeIssued" class="employee-issued">
          ISSUED: DD/MM/YYYY
        </div>
      </div>

    </div>

    <div class="datetime">
      <div id="liveDate" class="date-text"></div>
      <div id="liveTime" class="time-text"></div>
    </div>

    <button id="actionBtn"
            class="primary-btn action-btn"
            onclick="actionHandler()">
      เข้างาน
    </button>

    <div id="todayInfo"
         style="margin-top:16px;font-size:14px;opacity:.85;text-align:center;">
    </div>

  </div>

</div>

<!-- CUSTOM POPUP -->
<div id="customPopup" class="popup-overlay">
  <div class="popup-box">
    <div id="popupMessage" class="popup-message"></div>
    <button class="popup-btn" onclick="closePopup()">ตกลง</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
