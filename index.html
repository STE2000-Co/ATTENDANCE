<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Time System</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="card.css">
</head>
<body>

<div class="app-wrapper">

  <!-- LOGIN -->
  <div id="loginSection" class="login-container">
    <div class="login-card">
      <div class="logo-text">EMPLOYEE SYSTEM</div>

      <div class="input-group">
        <input type="email" id="email" required>
        <label>Email</label>
      </div>

      <div class="input-group">
        <input type="password" id="password" required>
        <label>Password</label>
      </div>

      <button class="primary-btn" onclick="login()">Login</button>
    </div>
  </div>

  <!-- APP -->
  <div id="appSection" style="display:none;">

    <div class="employee-card">

  <div class="card-top">
    <div class="company-title">บัตรประจำตัวพนักงาน</div>
    <div class="company-sub">บริษัท YOUR COMPANY</div>
  </div>

  <div class="photo-wrapper">
    <div class="avatar large">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
      </svg>
    </div>
  </div>

  <div class="card-info">
<div class="card-info">
  <div class="emp-name" id="empName">-</div>

  <div class="emp-position" id="empPosition">-</div>

  <div class="emp-department" id="empDepartment">-</div>

  <div class="emp-issue">
    ISSUED: <span id="empIssued">-</span>
  </div>
</div>

<div class="side-id" id="empId">-</div>

  <div class="barcode-section">
    <svg id="barcode" class="barcode"></svg>
  </div>

</div>

    <div class="datetime">
      <div id="liveDate" class="date-text"></div>
      <div id="liveTime" class="time-text"></div>
    </div>

    <button id="actionBtn"
            class="primary-btn action-btn"
            onclick="actionHandler()">
      เข้างาน
    </button>

    <!-- ✅ เพิ่มตรงนี้ -->
    <div id="todayInfo"
         style="margin-top:16px;font-size:14px;opacity:.85;text-align:center;">
    </div>

  </div>

</div>

<!-- CUSTOM POPUP -->
<div id="customPopup" class="popup-overlay">
  <div class="popup-box">
    <div id="popupMessage" class="popup-message"></div>
    <button class="popup-btn" onclick="closePopup()">ตกลง</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
