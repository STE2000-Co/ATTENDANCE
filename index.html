<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Card</title>
  <link rel="stylesheet" href="card.css">
</head>
<body>

  <!-- FLIP CARD -->
  <div class="employee-card" onclick="this.classList.toggle('flipped')">
    <div class="card-inner">
      
      <!-- FRONT -->
      <div class="card-face card-front">
        <div class="card-header"></div>
        <div class="card-body">
          <div class="photo-section">
            <div class="avatar">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
              </svg>
            </div>
          </div>
          <div class="info-section">
            <div class="emp-name" id="empName">-</div>
            <div class="emp-position" id="empPosition">TITLE</div>
            <div class="meta-line">
              <div class="meta-id">ID: <span id="empId">-</span></div>
              <div class="meta-issued">ISSUED: <span id="issuedDate">01/01/2026</span></div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- BACK -->
      <div class="card-face card-back">
        <div class="card-back-content">
          <svg id="barcode" class="barcode"></svg>
          <div class="back-id">
            <span id="empIdBack">-</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>

</body>
</html>
